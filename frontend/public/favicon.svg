<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Subtle dark indigo/violet glow in center, rich zinc on edges -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18153c" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#030303" />
    </radialGradient>
    
    <!-- Accent Gradient: Indigo to Violet -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Intense Glow Filter for Neon Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Light Glow Filter for Subtle Glows -->
    <filter id="lightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect with glassmorphic border -->
  <rect width="500" height="500" x="6" y="6" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Abstract Monogram Y/G + Futuristic Barbell Gym Element -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Glowing Accent Circles behind Logo for depth -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="10 15" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.1" />

    <!-- Stylized "G" frame (glowing outer ring that forms a G) -->
    <path d="M 91.9 -91.9 A 130 130 0 1 0 130 0 L 50 0" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Stylized "Y" / Dumbbell element inside -->
    <!-- Central Shaft of Y (acting as barbell sleeve) -->
    <line x1="0" y1="-20" x2="0" y2="100" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
    
    <!-- Top Left branch of Y -->
    <path d="M 0 -20 Q -40 -60 -75 -75" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
    
    <!-- Top Right branch of Y -->
    <path d="M 0 -20 Q 40 -60 75 -75" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Weights / Plates at the ends of the Y branch (Futuristic hexagon weight plates) -->
    <!-- Left Plate -->
    <g transform="translate(-75, -75) rotate(-45)">
      <rect x="-15" y="-30" width="30" height="60" rx="8" fill="url(#accentGrad)" filter="url(#lightGlow)" />
      <rect x="-6" y="-20" width="12" height="40" rx="4" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Right Plate -->
    <g transform="translate(75, -75) rotate(45)">
      <rect x="-15" y="-30" width="30" height="60" rx="8" fill="url(#accentGrad)" filter="url(#lightGlow)" />
      <rect x="-6" y="-20" width="12" height="40" rx="4" fill="#ffffff" opacity="0.9" />
    </g>
    
    <!-- Bottom Plate of the Y (dumbbell base plate) -->
    <g transform="translate(0, 100)">
      <rect x="-30" y="-15" width="60" height="30" rx="8" fill="url(#accentGrad)" filter="url(#lightGlow)" />
      <rect x="-20" y="-6" width="40" height="12" rx="4" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Pulse/Sound waves (glowing accent bars behind or around the weights) -->
    <path d="M -150 -40 A 160 160 0 0 1 -150 40" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M -170 -25 A 180 180 0 0 1 -170 25" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.2" />

    <path d="M 150 -40 A 160 160 0 0 0 150 40" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 170 -25 A 180 180 0 0 0 170 25" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.2" />

    <!-- Inner Core Glow: Center of the monogram -->
    <circle cx="0" cy="-20" r="14" fill="#ffffff" filter="url(#lightGlow)" />
  </g>
</svg>